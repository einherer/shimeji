############################################################
# Standardkonfiguration für die Protokollierung
#
# Eine andere Datei kann über die Systemeigenschaft
# java.util.logging.config.file angegeben werden.
# Beispiel: java -Djava.util.logging.config.file=myfile
############################################################

############################################################
# Globale Eigenschaften
############################################################

# "handlers" enthält eine durch Kommas getrennte Liste von
# Handler-Klassen, die beim Start der VM eingerichtet werden.
# Diese Klassen müssen sich im Systemklassenpfad befinden.
# Standardmäßig wird nur ein ConsoleHandler eingerichtet,
# der Meldungen ab der Stufe INFO anzeigt.
handlers= java.util.logging.ConsoleHandler

# Für einen zusätzlichen FileHandler stattdessen diese Zeile verwenden.
#handlers= java.util.logging.FileHandler, java.util.logging.ConsoleHandler

# Globale Standardstufe für die Protokollierung.
# Sie legt für alle Logger fest, welche Ereignisse protokolliert werden.
# Einzelne Logger können diese Vorgabe mit einer eigenen Stufe überschreiben.
# Der ConsoleHandler hat zusätzlich eine eigene Stufe, um die
# auf der Konsole ausgegebenen Meldungen einzuschränken.
.level= INFO

############################################################
# Eigenschaften und Konfiguration der einzelnen Handler
############################################################

# Konsolenausgabe ab der hier angegebenen Protokollstufe zulassen.
java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = com.group_finity.mascot.LogFormatter
#java.util.logging.SimpleFormatter

com.group_finity.mascot.level=WARNING
